<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quad Splat</title>
<style>
  :root{
    --ground:#12161B; --panel:#1B2128; --rule:#2B333C;
    --ink:#E6E2DB; --dim:#98A2AC; --faint:#6C7681; --accent:#C96A4C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas:active{cursor:grabbing}
  #hud{position:fixed;left:14px;top:14px;background:rgba(20,25,31,.86);
    border:1px solid var(--rule);border-radius:9px;padding:11px 13px;
    backdrop-filter:blur(8px);max-width:min(330px,calc(100vw - 28px))}
  #hud h1{margin:0 0 3px;font-size:14px;font-weight:600;letter-spacing:.01em}
  #hud .sub{color:var(--faint);font-size:11.5px;margin-bottom:9px}
  #stats{font:11.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
    font-variant-numeric:tabular-nums}
  #stats b{color:var(--ink);font-weight:500}
  #keys{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);
    color:var(--faint);font-size:11.5px}
  kbd{font:11px ui-monospace,monospace;background:#252C34;border:1px solid var(--rule);
    border-radius:4px;padding:0 4px;color:var(--dim)}
  #load{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);
    z-index:9;text-align:center;padding:20px}
  #load .bar{width:min(300px,70vw);height:3px;background:var(--rule);border-radius:2px;
    margin:12px auto 0;overflow:hidden}
  #load .bar i{display:block;height:100%;width:0;background:var(--accent);
    transition:width .18s ease}
  #err{color:var(--accent);max-width:44ch;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <h1>Illinois main quad</h1>
  <div class="sub">gaussian splat, trained on renders of the lidar scene</div>
  <div id="stats"></div>
  <div id="keys">drag orbit &middot; <kbd>shift</kbd>+drag pan &middot; wheel zoom &middot;
    <kbd>R</kbd> reset</div>
</div>
<div id="load"><div><div>loading splat</div><div class="bar"><i id="pb"></i></div>
  <div id="err"></div></div></div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
precision highp float; precision highp int;
uniform highp usampler2D uData;
uniform mat4 uView, uProj;
uniform vec2 uFocal, uViewport;
uniform vec4 uSkyPlane;          // xyz: up in this payload's frame; w: where the sky starts
uniform float uSkyFade;          // 0 keeps the backdrop, 1 takes it away
in vec2 aCorner;
in uint aIndex;
out vec4 vColour;
out vec2 vPos;

mat3 quatToMat(vec4 q){          // q is (w, x, y, z), already unit length
  float w=q.x, x=q.y, y=q.z, z=q.w;
  return mat3(
    1.0-2.0*(y*y+z*z), 2.0*(x*y+w*z),     2.0*(x*z-w*y),
    2.0*(x*y-w*z),     1.0-2.0*(x*x+z*z), 2.0*(y*z+w*x),
    2.0*(x*z+w*y),     2.0*(y*z-w*x),     1.0-2.0*(x*x+y*y));
}

void main(){
  int i = int(aIndex);
  ivec2 tx = ivec2((i & 0x3ff) << 1, i >> 10);
  uvec4 a = texelFetch(uData, tx, 0);
  uvec4 b = texelFetch(uData, ivec2(tx.x | 1, tx.y), 0);

  vec3 centre = uintBitsToFloat(a.xyz);
  // The backdrop, when the eye has climbed above it. This model paints a sky
  // out of a few thousand very large gaussians standing over the roofs; from a
  // camera above them the campus is seen through the backdrop and comes out
  // white. uSkyPlane.xyz is which way up is in this payload's frame -- the two
  // pages do not agree on that -- and .w is the height the backdrop starts at.
  // uSkyFade is 0 for every camera under it, so a page that never sets these
  // draws exactly what it always drew.
  float skyKeep = (uSkyFade > 0.0 && dot(centre, uSkyPlane.xyz) > uSkyPlane.w)
                  ? 1.0 - uSkyFade : 1.0;
  if (skyKeep < 0.004) {
    gl_Position = vec4(0.0, 0.0, 2.0, 1.0);
    return;
  }
  vec4 cam = uView * vec4(centre, 1.0);
  vec4 clip = uProj * cam;
  // Behind, or far enough off screen that its quad cannot reach back in. The
  // margin is 1.8 rather than 1.35 because it is a test on the centre and the
  // quad is now twice as wide as it was: at 1.35 a large gaussian just off the
  // edge vanished while it was still covering pixels, which reads as popping
  // when you turn. 1.8 in clip space is the same window check_splat.py uses in
  // pixels, so the two agree about what is on screen as well as how it draws.
  if (clip.w <= 0.0 || any(greaterThan(abs(clip.xyz), vec3(1.8, 1.8, 1.0) * clip.w))) {
    gl_Position = vec4(0.0, 0.0, 2.0, 1.0);
    return;
  }

  vec3 scale = uintBitsToFloat(b.xyz);
  vec4 qb = vec4(uvec4(b.w & 0xffu, (b.w >> 8) & 0xffu,
                       (b.w >> 16) & 0xffu, (b.w >> 24) & 0xffu)) / 128.0 - 1.0;
  mat3 M = quatToMat(normalize(qb)) * mat3(scale.x, 0.0, 0.0,
                                           0.0, scale.y, 0.0,
                                           0.0, 0.0, scale.z);
  mat3 sigma = M * transpose(M);

  // The 3D covariance through the perspective projection, to first order.
  // The linearisation is only good near the optical axis: a gaussian close to
  // the eye and out towards the edge of the frame projects to an ellipse tens
  // of times too long, and draws as a streak across the picture. Clamping the
  // point the Jacobian is taken at to 1.3 times the field of view is what the
  // CUDA rasteriser the model was fitted with does, and it is why its renders
  // have no streaks in them and ours did.
  float iz = 1.0 / cam.z;
  vec2 lim = 1.3 * uViewport / (2.0 * uFocal);
  vec2 tt = clamp(cam.xy * iz, -lim, lim) * cam.z;
  mat3 J = mat3(uFocal.x * iz, 0.0, 0.0,
                0.0, uFocal.y * iz, 0.0,
                -uFocal.x * tt.x * iz * iz, -uFocal.y * tt.y * iz * iz, 0.0);
  mat3 T = J * mat3(uView);
  mat3 c2 = T * sigma * transpose(T);
  float ca = c2[0][0] + 0.3, cb = c2[0][1], cc = c2[1][1] + 0.3;

  float mid = 0.5 * (ca + cc);
  float rad = sqrt(max(0.02, mid * mid - (ca * cc - cb * cb)));
  float l1 = mid + rad, l2 = max(mid - rad, 0.02);
  if (l1 < 0.35) {                       // smaller than a pixel: not worth a quad
    gl_Position = vec4(0.0, 0.0, 2.0, 1.0);
    return;
  }
  vec2 e1 = normalize(abs(cb) < 1e-8 ? vec2(1.0, 0.0) : vec2(cb, l1 - ca));
  vec2 major = min(sqrt(2.0 * l1), 900.0) * e1;
  vec2 minor = min(sqrt(2.0 * l2), 900.0) * vec2(e1.y, -e1.x);

  uvec4 col = uvec4(a.w & 0xffu, (a.w >> 8) & 0xffu,
                    (a.w >> 16) & 0xffu, (a.w >> 24) & 0xffu);
  vColour = vec4(col) / 255.0;
  vColour.a *= skyKeep;
  // The quad has to be as wide as the falloff written in the fragment shader,
  // and it was half as wide. aCorner runs to 1, vPos to 2, so a corner sits at
  // p = -4; a pixel d along the major axis must land at p = -0.5*d*d/l1, which
  // needs the half extent to be 2*sqrt(2*l1) rather than sqrt(2*l1). With the
  // old factor every gaussian in the scene was drawn at half its own width:
  // surfaces stopped overlapping, the ground broke into speckle and walls read
  // as see-through. The same arithmetic was wrong the same way in
  // scripts/web/check_splat.py, so every check agreed with it.
  vPos = aCorner * 2.0;
  vec2 off = (aCorner.x * major + aCorner.y * minor) * 4.0 / uViewport;
  gl_Position = vec4(clip.xy / clip.w + off, clip.z / clip.w, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec4 vColour;
in vec2 vPos;
out vec4 oColour;
void main(){
  float p = -dot(vPos, vPos);      // -0.5 * d' * inv(cov2d) * d, by construction
  if (p < -4.0) discard;           // the inscribed disc: square corners are not gaussian
  float alpha = exp(p) * vColour.a;
  if (alpha < 0.004) discard;
  oColour = vec4(vColour.rgb * alpha, alpha);   // premultiplied
}
</script>

<script>
const CV = document.getElementById('cv');
const LOAD = document.getElementById('load'), PB = document.getElementById('pb');
const ERR = document.getElementById('err'), STATS = document.getElementById('stats');
const fail = m => { LOAD.style.display='grid'; ERR.textContent = m; };

const gl = CV.getContext('webgl2', {antialias:false, alpha:false,
  premultipliedAlpha:false, powerPreference:'high-performance'});
if (!gl) fail('This browser has no WebGL2, which the renderer needs.');

// ---- the depth sort, off the main thread -------------------------------------
const SORTER = `
let pos = null, n = 0;
self.onmessage = e => {
  if (e.data.positions) { pos = e.data.positions; n = pos.length / 3; return; }
  if (!pos) return;
  const v = e.data.view;                       // third row of the view matrix
  const d = new Int32Array(n);
  let lo = 1e30, hi = -1e30;
  for (let i = 0; i < n; i++) {
    // negated, so that sorting ascending puts the far ones first. Premultiplied
    // "over" blending composites back to front; near first draws it inside out.
    const z = v[0]*pos[3*i] + v[1]*pos[3*i+1] + v[2]*pos[3*i+2];
    d[i] = -z * 4096 | 0;
    if (d[i] < lo) lo = d[i];
    if (d[i] > hi) hi = d[i];
  }
  // counting sort: far to near, so premultiplied over-blending composites right
  const B = 65536, cnt = new Uint32Array(B), s = (B - 1) / Math.max(hi - lo, 1);
  for (let i = 0; i < n; i++) { d[i] = (d[i] - lo) * s | 0; cnt[d[i]]++; }
  let run = 0;
  for (let i = 0; i < B; i++) { const c = cnt[i]; cnt[i] = run; run += c; }
  const order = new Uint32Array(n);
  for (let i = 0; i < n; i++) order[cnt[d[i]]++] = i;
  self.postMessage({order}, [order.buffer]);
};`;
const worker = new Worker(URL.createObjectURL(new Blob([SORTER], {type:'text/javascript'})));

// ---- program ----------------------------------------------------------------
function shader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim()); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog, uni = {}, texData, idxBuf, count = 0, ready = false;
try {
  prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  for (const k of ['uData','uView','uProj','uFocal','uViewport']) uni[k] = gl.getUniformLocation(prog, k);
} catch (e) { fail('Shader failed: ' + e.message); }

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, 1,1, -1,1]), gl.STATIC_DRAW);
const aCorner = gl.getAttribLocation(prog, 'aCorner');
gl.enableVertexAttribArray(aCorner);
gl.vertexAttribPointer(aCorner, 2, gl.FLOAT, false, 0, 0);

idxBuf = gl.createBuffer();
const aIndex = gl.getAttribLocation(prog, 'aIndex');
gl.bindBuffer(gl.ARRAY_BUFFER, idxBuf);
gl.enableVertexAttribArray(aIndex);
gl.vertexAttribIPointer(aIndex, 1, gl.UNSIGNED_INT, 0, 0);
gl.vertexAttribDivisor(aIndex, 1);

gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

// ---- camera -----------------------------------------------------------------
// The payload is y-up. scripts/web/01_splat_payload.py bakes the rotation out of
// the z-up scene frame and quad.json records it; UP is checked against the
// sidecar on load rather than assumed here.
const UP = [0,1,0];
let target = [0,0,0], yaw = -0.9, pitch = 0.42, dist = 700, fov = 42;
let HOME_DIST = 700;
const HOME = () => { yaw = -0.9; pitch = 0.42; dist = HOME_DIST; target = [0,0,0]; };
function eyePos(){
  const cp = Math.cos(pitch);
  return [target[0] + dist*cp*Math.cos(yaw),
          target[1] + dist*Math.sin(pitch),
          target[2] + dist*cp*Math.sin(yaw)];
}
function viewMatrix(){
  const eye = eyePos();
  const f = norm(sub(target, eye));
  const r = norm(cross(f, UP)), u = cross(r, f);
  // World to camera, looking down +z. The forward row is +f, not -f: the
  // projection divides by z, so a point in front of the camera has to come out
  // with positive z or the whole scene is culled as being behind it.
  // The up row is +u, not -u. It used to be -u, which put camera y downward
  // while the projection below sends +y to the top of the NDC cube, so the sky
  // came out at the bottom of the screen. The covariance is carried through the
  // same matrix, so the splats were mirrored with it and nothing looked torn --
  // it looked like a scene that had simply been built upside down.
  return [ r[0], u[0], f[0], 0,
           r[1], u[1], f[1], 0,
           r[2], u[2], f[2], 0,
           -dot(r,eye), -dot(u,eye), -dot(f,eye), 1 ];
}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a)||1;return [a[0]/l,a[1]/l,a[2]/l];};

function projMatrix(w,h){
  const fy = h / (2*Math.tan(fov*Math.PI/360)), fx = fy;
  const near = 1.0, far = 6000.0;
  return { m: [2*fx/w,0,0,0, 0,2*fy/h,0,0, 0,0,far/(far-near),1,
               0,0,-far*near/(far-near),0], fx, fy };
}

let drag = null;
CV.addEventListener('pointerdown', e => {
  CV.setPointerCapture(e.pointerId);
  drag = {x:e.clientX, y:e.clientY, pan:e.shiftKey || e.button===1};
});
CV.addEventListener('pointerup', e => { drag = null; });
CV.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    // slide the ground under the cursor: right and forward in the horizontal
    // plane, so panning never lifts the target off the terrain
    const s = dist * 0.0016;
    const right = [Math.sin(yaw), 0, -Math.cos(yaw)];
    const fwd = [-Math.cos(yaw), 0, -Math.sin(yaw)];
    for (let i = 0; i < 3; i++) target[i] += (-dx*right[i] + dy*fwd[i]) * s;
  } else {
    yaw -= dx * 0.005;
    pitch = Math.max(0.02, Math.min(1.52, pitch + dy * 0.005));
  }
});
CV.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(40, Math.min(2600, dist * Math.exp(e.deltaY * 0.0011)));
}, {passive:false});
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') HOME(); });

// ---- load -------------------------------------------------------------------
(async function(){
  try {
    const meta = await (await fetch('quad.json')).json();
    if (!meta.up || meta.up.join() !== UP.join())
      throw new Error('quad.json says up is ' + JSON.stringify(meta.up) +
                      ', this viewer orbits about ' + JSON.stringify(UP));
    const res = await fetch('quad.splat');
    if (!res.ok) throw new Error('quad.splat: HTTP ' + res.status);
    const total = +res.headers.get('content-length') || meta.count * 32;
    const chunks = []; let got = 0;
    const reader = res.body.getReader();
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      PB.style.width = Math.min(100, 100*got/total) + '%';
    }
    const buf = new Uint8Array(got); let o = 0;
    for (const c of chunks) { buf.set(c, o); o += c.length; }
    count = Math.floor(buf.length / 32);

    // the shader reads two RGBA32UI texels a gaussian, 1024 gaussians a row
    const rows = Math.ceil(count / 1024);
    const tex = new Uint32Array(1024 * 2 * 4 * rows);
    const f32 = new Float32Array(buf.buffer, buf.byteOffset, count * 8);
    const u32 = new Uint32Array(buf.buffer, buf.byteOffset, count * 8);
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const s = i * 8, d = i * 8;
      tex[d+0] = u32[s+0]; tex[d+1] = u32[s+1]; tex[d+2] = u32[s+2];
      tex[d+3] = u32[s+6];                       // rgba8
      tex[d+4] = u32[s+3]; tex[d+5] = u32[s+4]; tex[d+6] = u32[s+5];
      tex[d+7] = u32[s+7];                       // quaternion bytes
      positions[3*i] = f32[s]; positions[3*i+1] = f32[s+1]; positions[3*i+2] = f32[s+2];
    }
    texData = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texData);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32UI, 2048, rows, 0,
                  gl.RGBA_INTEGER, gl.UNSIGNED_INT, tex);
    for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER])
      gl.texParameteri(gl.TEXTURE_2D, p, gl.NEAREST);
    gl.uniform1i(uni.uData, 0);

    worker.postMessage({positions}, [positions.buffer]);
    // frame the longest side of the model in the vertical field of view
    HOME_DIST = Math.max(...meta.bounds[1].map((v,i)=>v-meta.bounds[0][i]))
                / (2*Math.tan(fov*Math.PI/360)) * 0.8;
    dist = HOME_DIST;
    ready = true;
    LOAD.style.display = 'none';
    requestAnimationFrame(frame);
  } catch (e) {
    fail(e.message + '  —  this page has to be served over http, not opened as a file.');
  }
})();

let order = null, sorting = false, lastKey = '', fps = 0, tPrev = performance.now();
worker.onmessage = e => {
  order = e.data.order; sorting = false;
  gl.bindBuffer(gl.ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ARRAY_BUFFER, order, gl.DYNAMIC_DRAW);
};

function frame(){
  requestAnimationFrame(frame);
  if (!ready) return;
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (CV.width !== w || CV.height !== h) { CV.width = w; CV.height = h; }
  gl.viewport(0, 0, w, h);
  gl.clearColor(0.055, 0.070, 0.086, 1); gl.clear(gl.COLOR_BUFFER_BIT);

  const V = viewMatrix(), P = projMatrix(w, h);
  const key = [yaw, pitch, dist, target[0], target[1]].map(v=>v.toFixed(2)).join();
  if (!sorting && key !== lastKey) {
    lastKey = key; sorting = true;
    worker.postMessage({view: [V[2], V[6], V[10]]});
  }
  if (order) {
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texData);
    gl.uniformMatrix4fv(uni.uView, false, V);
    gl.uniformMatrix4fv(uni.uProj, false, P.m);
    gl.uniform2f(uni.uFocal, P.fx, P.fy);
    gl.uniform2f(uni.uViewport, w, h);
    gl.drawArraysInstanced(gl.TRIANGLE_FAN, 0, 4, count);
  }
  const now = performance.now();
  fps = fps * 0.9 + (1000 / Math.max(now - tPrev, 1)) * 0.1; tPrev = now;
  STATS.innerHTML =
    `gaussians <b>${count.toLocaleString()}</b><br>` +
    `distance  <b>${dist.toFixed(0)} m</b><br>` +
    `elevation <b>${(pitch*180/Math.PI).toFixed(0)}&deg;</b><br>` +
    `fps       <b>${fps.toFixed(0)}</b>`;
}
</script>
</body>
</html>
